  /* ============================================================
     ANALYTICS (with heatmap)
     ============================================================ */
  renderAnalytics(){
    const a=window.BioHubAuth.getAnalytics();
    const ev=a.allEvents;
    /* Heatmap: 7 days x 24 hours */
    const now=Date.now();
    const days=7;
    const dayNames=[this.t('sunday'),this.t('monday'),this.t('tuesday'),this.t('wednesday'),this.t('thursday'),this.t('friday'),this.t('saturday')];
    /* Build matrix */
    const matrix=Array.from({length:days},()=>Array(24).fill(0));
    ev.forEach(e=>{
      const t=new Date(e.timestamp);
      const dayAgo=Math.floor((now-t.getTime())/86400000);
      if(dayAgo>=0&&dayAgo<days){
        const dayIdx=days-1-dayAgo;
        const hour=t.getHours();
        matrix[dayIdx][hour]++;
      }
    });
    const maxVal=Math.max(...matrix.flat(),1);
    const heatmapRows=matrix.map((row,dayIdx)=>{
      const cells=row.map((c,hour)=>`<div class="adm-heatmap-cell" data-level="${c===0?0:Math.min(5,Math.ceil(c/maxVal*5))}" data-tip="${dayNames[(new Date(now-(days-1-dayIdx)*86400000).getDay())]} ${hour}:00 - ${c} events"></div>`).join('');
      return `<div class="adm-heatmap-label">${dayNames[(new Date(now-(days-1-dayIdx)*86400000).getDay())]}</div>${cells}`;
    }).join('');
    const heatmapHtml=`<div class="adm-heatmap"><div class="adm-heatmap-label"></div>${Array.from({length:24},(_,i)=>`<div class="adm-heatmap-label" style="justify-content:center;font-size:.65rem">${i}</div>`).join('')}${heatmapRows}</div>
    <div class="adm-heatmap-legend">
      <span>${this.t('heatmap_legend')}</span>
      <div class="adm-heatmap-legend-cells">
        <div class="adm-heatmap-cell" data-level="0"></div>
        <div class="adm-heatmap-cell" data-level="1"></div>
        <div class="adm-heatmap-cell" data-level="2"></div>
        <div class="adm-heatmap-cell" data-level="3"></div>
        <div class="adm-heatmap-cell" data-level="4"></div>
        <div class="adm-heatmap-cell" data-level="5"></div>
      </div>
    </div>`;
    /* Stat cards */
    const stats=[
      {i:'👥',v:a.totalUsers,l:this.t('stat_users')},
      {i:'🟢',v:a.activeUsers,l:this.t('stat_active')},
      {i:'👁️',v:a.totalVisits,l:this.t('stat_visits')},
      {i:'🎮',v:a.gamesPlayed,l:this.t('stat_games')}
    ];
    const sh=stats.map(s=>`<div class="adm-stat-card"><div class="adm-stat-icon">${s.i}</div><div class="adm-stat-value">${s.v}</div><div class="adm-stat-label">${s.l}</div></div>`).join('');
    /* Lesson completion rates */
    const users=window.BioHubAuth.getUsers();
    const lessonStats=window.BioHubData.pythonLessons.map(l=>{
      const completed=users.filter(u=>u.progress&&u.progress[l.slug]&&u.progress[l.slug].completed).length;
      const rate=users.length?Math.round(completed/users.length*100):0;
      return {...l,completed,rate};
    }).sort((a,b)=>b.rate-a.rate);
    const lessonBars=lessonStats.slice(0,8).map(l=>`<div style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:.85rem">
        <span style="color:var(--adm-text-2)">#${l.order} ${window.BioHubAuth.adminLang==='fa'?l.titleFa:l.titleEn}</span>
        <strong style="color:var(--adm-primary-light)">${l.rate}% (${l.completed})</strong>
      </div>
      <div class="adm-progress"><div class="adm-progress-bar" style="width:${l.rate}%"></div></div>
    </div>`).join('');
    /* Game scores */
    const gameAvg={branch_quiz:[],dna_match:[],cell_builder:[],ecosystem:[]};
    users.forEach(u=>{Object.entries(u.gameScores||{}).forEach(([g,s])=>{if(gameAvg[g])gameAvg[g].push(s);});});
    const gameStats=Object.entries(gameAvg).map(([g,scores])=>({
      game:g,
      avg:scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):0,
      max:scores.length?Math.max(...scores):0,
      count:scores.length
    }));
    const gameBars=gameStats.map(s=>`<div style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:.85rem">
        <span style="color:var(--adm-text-2)">${s.game.replace(/_/g,' ')}</span>
        <strong style="color:var(--adm-primary-light)">avg: ${s.avg} / max: ${s.max} (${s.count} players)</strong>
      </div>
      <div class="adm-progress"><div class="adm-progress-bar" style="width:${Math.min(100,s.avg/2)}%"></div></div>
    </div>`).join('');
    /* User growth (30 days line chart) */
    const growth=Array.from({length:30},(_,i)=>{
      const dayStart=now-(29-i)*86400000;
      return users.filter(u=>u.createdAt&&new Date(u.createdAt).getTime()<=dayStart+86400000).length;
    });
    const maxGrowth=Math.max(...growth,1);
    const points=growth.map((c,i)=>`${(i/29)*100},${100-(c/maxGrowth)*100}`).join(' ');
    const lineChart=`<svg class="adm-line-chart" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs><linearGradient id="area-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#10b981" stop-opacity="0.5"/><stop offset="100%" stop-color="#10b981" stop-opacity="0"/></linearGradient></defs>
      <line class="grid-line" x1="0" y1="25" x2="100" y2="25"/><line class="grid-line" x1="0" y1="50" x2="100" y2="50"/><line class="grid-line" x1="0" y1="75" x2="100" y2="75"/>
      <path class="area" d="M0,100 L${points.split(' ').map(p=>p.replace(',',' ')).join(' L')} L100,100 Z"/>
      <path class="line" d="M${points.split(' ').map(p=>p.replace(',',' ')).join(' L')}"/>
    </svg>`;
    return `<div class="adm-stat-grid">${sh}</div>
    <div class="adm-card" style="margin-bottom:24px">
      <div class="adm-card-header"><div><div class="adm-card-title">🔥 ${this.t('heatmap_title')}</div><div class="adm-card-subtitle">${this.t('recent_activity')}</div></div>
        <button class="adm-btn adm-btn-sm" onclick="BioHubAdmin.exportAnalytics()">${this.t('export_report')}</button>
      </div>
      <div style="overflow-x:auto">${heatmapHtml}</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px" class="admin-responsive-grid">
      <div class="adm-card">
        <div class="adm-card-header"><div class="adm-card-title">📈 ${this.t('chart_growth')}</div></div>
        ${lineChart}
        <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:.75rem;color:var(--adm-text-muted)"><span>30 days ago</span><span>today</span></div>
      </div>
      <div class="adm-card">
        <div class="adm-card-header"><div class="adm-card-title">🎮 ${this.t('chart_game_scores')}</div></div>
        ${gameBars}
      </div>
    </div>
    <div class="adm-card">
      <div class="adm-card-header"><div class="adm-card-title">🎓 ${this.t('chart_completion')}</div></div>
      ${lessonBars}
    </div>`;
  },
  exportAnalytics(){
    const a=window.BioHubAuth.getAnalytics();
    const data={exportedAt:new Date().toISOString(),analytics:a,users:window.BioHubAuth.getUsers().map(u=>({id:u.id,username:u.username,points:u.points,createdAt:u.createdAt,lastLogin:u.lastLogin,blocked:u.blocked,completedLessons:Object.values(u.progress||{}).filter(p=>p.completed).length,gameScores:u.gameScores}))};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a_=document.createElement('a');a_.href=url;a_.download=`biohub-analytics-${Date.now()}.json`;a_.click();URL.revokeObjectURL(url);
    this.showToast(this.t('export_report')+' ✓','success');
  },

  filterLogs(type){

      <td style="padding:10px 16px;border-bottom:1px solid var(--adm-border);font-family:var(--font-mono);font-size:.72rem">${new Date(e.timestamp).toLocaleString(window.BioHubAuth.adminLang==='fa'?'fa-IR':'en-US')}</td>
      <td style="padding:10px 16px;border-bottom:1px solid var(--adm-border)"><span class="adm-badge ${this.eventBadgeClass(e.type)}">${this.eventLabel(e.type)}</span></td>
      <td style="padding:10px 16px;border-bottom:1px solid var(--adm-border);color:var(--adm-text-2);font-size:.8rem">${e.data&&JSON.stringify(e.data).substring(0,60)||'-'}</td>
      <td style="padding:10px 16px;border-bottom:1px solid var(--adm-border);color:var(--adm-text-muted);font-size:.8rem">${e.lang||'-'}</td>
      <td style="padding:10px 16px;border-bottom:1px solid var(--adm-border);color:var(--adm-text-muted);font-family:var(--font-mono);font-size:.7rem">${e.path||'-'}</td>
    </tr>`).join('');
  },
  searchLogs(q){
    q=(q||'').toLowerCase();
    const ev=window.BioHubAuth.getEvents().slice().reverse();
    const filtered=ev.filter(e=>JSON.stringify(e).toLowerCase().includes(q));
    const tbody=document.getElementById('logs-tbody');if(!tbody)return;
    if(!filtered.length){tbody.innerHTML=`<tr><td colspan="5" class="adm-empty"><p>${this.t('no_activity')}</p></td></tr>`;return;}
    tbody.innerHTML=filtered.slice(0,100).map(e=>`<tr>

  clearLogFilters(){document.querySelectorAll('.adm-filter-chip').forEach(c=>c.classList.remove('active'));document.querySelector('.adm-filter-chip[data-type="all"]').classList.add('active');this.filterLogs('all');},
  exportLogs(){

    const failed=logs.length-success;
    const rows=logs.length?logs.slice(0,100).map(l=>{
      const browser=this.parseBrowser(l.userAgent);
      return `<tr>
        <td style="padding:10px 16px;border-bottom:1px solid var(--adm-border);font-family:var(--font-mono);font-size:.72rem;color:var(--adm-text-2)">${new Date(l.time).toLocaleString(window.BioHubAuth.adminLang==='fa'?'fa-IR':'en-US')}</td>
        <td style="padding:10px 16px;border-bottom:1px solid var(--adm-border)"><span class="adm-badge ${l.success?'adm-badge-success':'adm-badge-danger'}">${l.success?this.t('success'):this.t('failed')}</span></td>
        <td style="padding:10px 16px;border-bottom:1px solid var(--adm-border);color:var(--adm-text-2);font-size:.8rem">${l.reason==='success'?this.t('reason_success'):l.reason==='wrong_password'?this.t('reason_wrong_password'):this.t('reason_locked_out')}</td>
        <td style="padding:10px 16px;border-bottom:1px solid var(--adm-border);color:var(--adm-text-muted);font-size:.8rem">${l.platform||'-'}</td>
        <td style="padding:10px 16px;border-bottom:1px solid var(--adm-border);color:var(--adm-text-muted);font-size:.8rem">${browser}</td>
      </tr>`;}).join(''):`<tr><td colspan="5" class="adm-empty"><div class="adm-empty-icon">🔐</div><p>${this.t('no_activity')}</p></td></tr>`;
    return `<div class="adm-stat-grid" style="margin-bottom:24px">
      <div class="adm-stat-card"><div class="adm-stat-icon">📊</div><div class="adm-stat-value">${logs.length}</div><div class="adm-stat-label">Total attempts</div></div>
      <div class="adm-stat-card accent-cyan"><div class="adm-stat-icon">✓</div><div class="adm-stat-value">${success}</div><div class="adm-stat-label">${this.t('success')}</div></div>
      <div class="adm-stat-card accent-amber"><div class="adm-stat-icon">✗</div><div class="adm-stat-value">${failed}</div><div class="adm-stat-label">${this.t('failed')}</div></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px">
      <h3 style="color:var(--adm-text);font-size:1.05rem">${this.t('login_logs_title')}</h3>
      <button class="adm-btn adm-btn-danger adm-btn-sm" onclick="BioHubAdmin.clearLoginLogs()">${this.t('clear_logs')}</button>

        <thead><tr><th>${this.t('col_attempt_time')}</th><th>${this.t('col_success')}</th><th>${this.t('col_reason')}</th><th>${this.t('col_platform')}</th><th>${this.t('col_browser')}</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>

  parseBrowser(ua){
    if(!ua)return 'Unknown';
    if(ua.includes('Firefox'))return 'Firefox';
    if(ua.includes('Edg'))return 'Edge';
    if(ua.includes('Chrome'))return 'Chrome';
    if(ua.includes('Safari'))return 'Safari';
    if(ua.includes('Opera'))return 'Opera';
    return 'Other';
  },
  clearLoginLogs(){
    if(!confirm(this.t('confirm_clear')))return;

  /* ============================================================
     MESSAGES & ANNOUNCEMENTS
     ============================================================ */
  renderMessages(){
    const msgs=this.getMessages();
    const rows=msgs.length?msgs.map((m,i)=>`<tr>
      <td style="padding:12px 16px;border-bottom:1px solid var(--adm-border)"><strong style="color:var(--adm-text)">${window.BioHubAuth.adminLang==='fa'?m.titleFa:m.titleEn}</strong></td>
      <td style="padding:12px 16px;border-bottom:1px solid var(--adm-border)"><span class="adm-badge ${this.messageBadgeClass(m.type)}">${this.t('message_'+m.type)}</span></td>
      <td style="padding:12px 16px;border-bottom:1px solid var(--adm-border);color:var(--adm-text-muted);font-size:.75rem">${new Date(m.createdAt).toLocaleString(window.BioHubAuth.adminLang==='fa'?'fa-IR':'en-US')}</td>

        <tbody>${rows}</tbody>

  messageBadgeClass(type){return {info:'adm-badge-info',success:'adm-badge-success',warning:'adm-badge-warning',announcement:'adm-badge-purple'}[type]||'adm-badge-neutral';},
  getMessages(){try{return JSON.parse(localStorage.getItem('biohub_messages')||'[]');}catch(e){return[];}},
  saveMessages(m){localStorage.setItem('biohub_messages',JSON.stringify(m));},
  editMessage(index){
    const m=(index!==null&&index>=0)?this.getMessages()[index]:null;
    this.openModal({
      title:index!==null?`${this.t('edit')}`:this.t('new_message'),
      body:`<div class="adm-form-row">
        <div class="adm-form-group"><label class="adm-form-label">${this.t('message_title_fa')}</label><input type="text" class="adm-form-input" id="mf-titleFa" value="${m?m.titleFa:''}"></div>
        <div class="adm-form-group"><label class="adm-form-label">${this.t('message_title_en')}</label><input type="text" class="adm-form-input" id="mf-titleEn" value="${m?m.titleEn:''}"></div>
      </div>
      <div class="adm-form-group"><label class="adm-form-label">${this.t('message_type')}</label>
        <select class="adm-form-select" id="mf-type">
          ${['info','success','warning','announcement'].map(t=>`<option value="${t}" ${m&&m.type===t?'selected':''}>${this.t('message_'+t)}</option>`).join('')}
        </select>
      </div>
      <div class="adm-form-row">
        <div class="adm-form-group"><label class="adm-form-label">${this.t('message_body_fa')}</label><textarea class="adm-form-textarea" id="mf-bodyFa" rows="3">${m?m.bodyFa:''}</textarea></div>
        <div class="adm-form-group"><label class="adm-form-label">${this.t('message_body_en')}</label><textarea class="adm-form-textarea" id="mf-bodyEn" rows="3">${m?m.bodyEn:''}</textarea></div>
      </div>`,
      onSave:()=>{
        const data={
          titleFa:document.getElementById('mf-titleFa').value,
          titleEn:document.getElementById('mf-titleEn').value,
          type:document.getElementById('mf-type').value,
          bodyFa:document.getElementById('mf-bodyFa').value,
          bodyEn:document.getElementById('mf-bodyEn').value,
          createdAt:m?m.createdAt:new Date().toISOString()
        };
        if(!data.titleFa){this.showToast(this.t('error'),'error');return false;}
        const msgs=this.getMessages();
        if(index!==null&&index>=0){msgs[index]=data;}else{msgs.push(data);}
        this.saveMessages(msgs);
        this.showToast(this.t('message_sent'),'success');
        window.BioHubApp.render();return true;
      }
    });
  },
  deleteMessage(index){
    if(!confirm(this.t('confirm_delete')))return;
    const msgs=this.getMessages();msgs.splice(index,1);this.saveMessages(msgs);
    this.showToast(this.t('deleted_success'),'success');window.BioHubApp.render();
  },

  switchSettingsTab(e,tab){
    document.querySelectorAll('.adm-tab').forEach(t=>t.classList.remove('active'));

    document.querySelectorAll('.settings-tab-content').forEach(c=>c.style.display='none');
    document.getElementById('settings-tab-'+tab).style.display='block';
  },
  getFeatures(){try{return JSON.parse(localStorage.getItem('biohub_features')||'{}');}catch(e){return{};}},
  saveFeatures(f){localStorage.setItem('biohub_features',JSON.stringify(f));},
  toggleFeature(key,val){const f=this.getFeatures();f[key]=val;this.saveFeatures(f);this.showToast(this.t('saved'),'success');},
  saveGeneralSettings(){
    const features=this.getFeatures();
    features.siteName=document.getElementById('sf-siteName').value;
    features.siteDescription=document.getElementById('sf-siteDesc').value;
    this.saveFeatures(features);
    window.BioHubData.admin.sessionDurationMs=parseInt(document.getElementById('sf-sessionTimeout').value)*60000;
    window.BioHubData.admin.maxLoginAttempts=parseInt(document.getElementById('sf-maxAttempts').value);
    window.BioHubData.admin.lockoutMs=parseInt(document.getElementById('sf-lockoutMin').value)*60000;
    const newHash=document.getElementById('sf-urlHash').value.trim();
    if(newHash&&newHash!==window.BioHubData.admin.secretUrlHash){
      window.BioHubData.admin.secretUrlHash=newHash;
      this.showToast('URL changed - bookmark the new URL: #'+newHash,'warning',5000);
    }
    this.showToast(this.t('saved_success'),'success');
  },
  changePassword(){
    const cur=document.getElementById('sf-currentPass').value;
    const np=document.getElementById('sf-newPass').value;
    const cp=document.getElementById('sf-confirmPass').value;
    const err=document.getElementById('password-error');
    if(cur!==window.BioHubAuth.getStoredAdminPassword()){err.textContent=this.t('password_wrong');return;}
    if(np.length<8){err.textContent=this.t('password_too_short');return;}
    if(np!==cp){err.textContent=this.t('password_mismatch');return;}
    window.BioHubAuth.setAdminPassword(np);
    err.style.color='var(--adm-primary-light,#34d399)';
    err.textContent=this.t('password_changed');
    this.showToast(this.t('password_changed'),'success');
    document.getElementById('sf-currentPass').value='';
    document.getElementById('sf-newPass').value='';
    document.getElementById('sf-confirmPass').value='';
    setTimeout(()=>{err.textContent='';err.style.color='var(--adm-red,#ef4444)';},3000);
  },

    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=`biohub-content-${Date.now()}.json`;a.click();URL.revokeObjectURL(url);
    this.showToast(this.t('export_content')+' ✓','success');
  },
  handleImport(event){
    const file=event.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const data=JSON.parse(e.target.result);
        if(data.users)window.BioHubAuth.saveUsers(data.users);
        if(data.events)localStorage.setItem('biohub_events',JSON.stringify(data.events));
        if(data.logs)localStorage.setItem('biohub_login_logs',JSON.stringify(data.logs));
        if(data.messages)this.saveMessages(data.messages);
        if(data.content){
          if(data.content.branches)window.BioHubData.branches=data.content.branches;
          if(data.content.lessons)window.BioHubData.pythonLessons=data.content.lessons;
          if(data.content.careers)window.BioHubData.careers=data.content.careers;
          if(data.content.knowledgeQuiz)window.BioHubData.knowledgeQuiz=data.content.knowledgeQuiz;
          if(data.content.branchQuiz)window.BioHubData.branchQuiz=data.content.branchQuiz;
          this.saveContent();
        }
        if(data.settings)localStorage.setItem('biohub_settings',JSON.stringify(data.settings));
        if(data.features)this.saveFeatures(data.features);
        this.showToast(this.t('import_success'),'success');
        window.BioHubApp.render();
      }catch(err){
        console.error(err);
        this.showToast(this.t('import_error')+': '+err.message,'error');
      }
    };
    reader.readAsText(file);
  },
  resetAllData(){
    if(!confirm(this.t('confirm_reset_all')))return;
    if(!confirm('Are you absolutely sure? Type-confirm-required'))return;
    localStorage.clear();
    alert('All data cleared. The page will reload.');
    location.reload();
  },

  /* ============================================================
     MODAL HELPER
     ============================================================ */
  openModal({title,body,size='',onSave}){
    const existing=document.getElementById('adm-modal-overlay');if(existing)existing.remove();
    const overlay=document.createElement('div');overlay.className='adm-modal-overlay';overlay.id='adm-modal-overlay';
    overlay.innerHTML=`<div class="adm-modal ${size==='lg'?'adm-modal-lg':''}">
      <div class="adm-modal-header">
        <h3 class="adm-modal-title">${title}</h3>
        <button class="adm-modal-close" onclick="BioHubAdmin.closeModal()">×</button>
      </div>
      <div class="adm-modal-body">${body}</div>
      ${onSave?`<div class="adm-modal-footer">
        <button class="adm-btn" onclick="BioHubAdmin.closeModal()">${this.t('cancel')}</button>
        <button class="adm-btn adm-btn-primary" id="adm-modal-save">${this.t('save')}</button>
      </div>`:''}
    </div>`;
    overlay.addEventListener('click',e=>{if(e.target===overlay)this.closeModal();});
    document.body.appendChild(overlay);
    if(onSave){document.getElementById('adm-modal-save').addEventListener('click',()=>{const r=onSave();if(r!==false)this.closeModal();});}
  },
  closeModal(){const o=document.getElementById('adm-modal-overlay');if(o)o.remove();}
};
window.BioHubAdmin=BioHubAdmin;

/* ============================================================
   Bootstrap
   ============================================================ */
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>BioHubApp.init());
else BioHubApp.init();

</script>
</body>
</html>
