<style>
/* ============================================================
   BioHub Pro v3 — Professional Multi-Theme Design with Full Admin
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --font-fa:'Vazirmatn','Segoe UI',sans-serif;
  --font-en:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-display:'Space Grotesk','Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --r-sm:8px;--r-md:12px;--r-lg:18px;--r-xl:28px;--r-full:9999px;
  --s-xs:.25rem;--s-sm:.5rem;--s-md:1rem;--s-lg:1.5rem;--s-xl:2rem;--s-2xl:3rem;--s-3xl:4rem;
  --transition:cubic-bezier(0.16,1,0.3,1);
  --font-scale:1;
}
/* ====== THEME: EMERALD (default) ====== */
[data-theme="emerald"]{
  --primary:#10b981;--primary-light:#34d399;--primary-dark:#059669;
  --secondary:#06b6d4;--accent:#8b5cf6;
  --bg-primary:#fafbfd;--bg-secondary:#ffffff;--bg-tertiary:#f1f5f9;
  --text-primary:#0a0e1a;--text-secondary:#475569;--text-muted:#94a3b8;
  --border-color:#e2e8f0;
  --glass-bg:rgba(255,255,255,0.7);--glass-border:rgba(255,255,255,0.9);
  --nav-bg:rgba(255,255,255,0.85);--hero-bg:linear-gradient(135deg,#ecfdf5 0%,#f0fdfa 50%,#f0f9ff 100%);
  --grad-1:linear-gradient(135deg,#10b981 0%,#06b6d4 100%);
  --grad-2:linear-gradient(135deg,#34d399 0%,#14b8a6 100%);
  --grad-3:linear-gradient(135deg,#8b5cf6 0%,#ec4899 100%);
  --shadow-sm:0 1px 3px rgba(15,23,42,0.04),0 4px 20px rgba(15,23,42,0.06);
  --shadow-md:0 8px 30px rgba(16,185,129,0.12);
  --shadow-lg:0 20px 60px rgba(16,185,129,0.18);
  --particle-color:16,185,129;
}
[data-theme="ocean"]{
  --primary:#0ea5e9;--primary-light:#38bdf8;--primary-dark:#0284c7;
  --secondary:#06b6d4;--accent:#8b5cf6;
  --bg-primary:#f0f9ff;--bg-secondary:#ffffff;--bg-tertiary:#e0f2fe;
  --text-primary:#082f49;--text-secondary:#475569;--text-muted:#94a3b8;
  --border-color:#bae6fd;
  --glass-bg:rgba(255,255,255,0.7);--glass-border:rgba(255,255,255,0.9);
  --nav-bg:rgba(255,255,255,0.85);--hero-bg:linear-gradient(135deg,#e0f2fe 0%,#f0f9ff 50%,#ecfeff 100%);
  --grad-1:linear-gradient(135deg,#0ea5e9 0%,#06b6d4 100%);
  --grad-2:linear-gradient(135deg,#38bdf8 0%,#22d3ee 100%);
  --grad-3:linear-gradient(135deg,#8b5cf6 0%,#6366f1 100%);
  --shadow-sm:0 1px 3px rgba(8,47,73,0.04),0 4px 20px rgba(8,47,73,0.06);
  --shadow-md:0 8px 30px rgba(14,165,233,0.12);
  --shadow-lg:0 20px 60px rgba(14,165,233,0.18);
  --particle-color:14,165,233;
}
[data-theme="sunset"]{
  --primary:#f97316;--primary-light:#fb923c;--primary-dark:#ea580c;
  --secondary:#ec4899;--accent:#8b5cf6;
  --bg-primary:#fff7ed;--bg-secondary:#ffffff;--bg-tertiary:#ffedd5;
  --text-primary:#431407;--text-secondary:#7c2d12;--text-muted:#c2410c;
  --border-color:#fed7aa;
  --glass-bg:rgba(255,255,255,0.7);--glass-border:rgba(255,255,255,0.9);
  --nav-bg:rgba(255,255,255,0.85);--hero-bg:linear-gradient(135deg,#fff7ed 0%,#fef3c7 50%,#fce7f3 100%);
  --grad-1:linear-gradient(135deg,#f97316 0%,#ec4899 100%);
  --grad-2:linear-gradient(135deg,#fb923c 0%,#f472b6 100%);
  --grad-3:linear-gradient(135deg,#8b5cf6 0%,#ec4899 100%);
  --shadow-sm:0 1px 3px rgba(67,20,7,0.04),0 4px 20px rgba(67,20,7,0.06);
  --shadow-md:0 8px 30px rgba(249,115,22,0.12);
  --shadow-lg:0 20px 60px rgba(249,115,22,0.18);
  --particle-color:249,115,22;
}
[data-theme="midnight"]{
  --primary:#8b5cf6;--primary-light:#a78bfa;--primary-dark:#7c3aed;
  --secondary:#ec4899;--accent:#06b6d4;
  --bg-primary:#faf5ff;--bg-secondary:#ffffff;--bg-tertiary:#f3e8ff;
  --text-primary:#2e1065;--text-secondary:#475569;--text-muted:#94a3b8;
  --border-color:#e9d5ff;
  --glass-bg:rgba(255,255,255,0.7);--glass-border:rgba(255,255,255,0.9);
  --nav-bg:rgba(255,255,255,0.85);--hero-bg:linear-gradient(135deg,#faf5ff 0%,#fdf4ff 50%,#f0f9ff 100%);
  --grad-1:linear-gradient(135deg,#8b5cf6 0%,#ec4899 100%);
  --grad-2:linear-gradient(135deg,#a78bfa 0%,#f472b6 100%);
  --grad-3:linear-gradient(135deg,#06b6d4 0%,#8b5cf6 100%);
  --shadow-sm:0 1px 3px rgba(46,16,101,0.04),0 4px 20px rgba(46,16,101,0.06);
  --shadow-md:0 8px 30px rgba(139,92,246,0.12);
  --shadow-lg:0 20px 60px rgba(139,92,246,0.18);
  --particle-color:139,92,246;
}
[data-theme="forest"]{
  --primary:#059669;--primary-light:#34d399;--primary-dark:#047857;
  --secondary:#84cc16;--accent:#f59e0b;
  --bg-primary:#f0fdf4;--bg-secondary:#ffffff;--bg-tertiary:#dcfce7;
  --text-primary:#052e16;--text-secondary:#166534;--text-muted:#86efac;
  --border-color:#bbf7d0;
  --glass-bg:rgba(255,255,255,0.7);--glass-border:rgba(255,255,255,0.9);
  --nav-bg:rgba(255,255,255,0.85);--hero-bg:linear-gradient(135deg,#f0fdf4 0%,#f7fee7 50%,#ecfeff 100%);
  --grad-1:linear-gradient(135deg,#059669 0%,#84cc16 100%);
  --grad-2:linear-gradient(135deg,#34d399 0%,#a3e635 100%);
  --grad-3:linear-gradient(135deg,#f59e0b 0%,#84cc16 100%);
  --shadow-sm:0 1px 3px rgba(5,46,22,0.04),0 4px 20px rgba(5,46,22,0.06);
  --shadow-md:0 8px 30px rgba(5,150,105,0.12);
  --shadow-lg:0 20px 60px rgba(5,150,105,0.18);
  --particle-color:5,150,105;
}
/* ====== DARK MODE (user-toggleable) ====== */
.dark-theme{
  --bg-primary:#070b14;--bg-secondary:#0f172a;--bg-tertiary:#1e293b;
  --text-primary:#f9fafb;--text-secondary:#cbd5e1;--text-muted:#64748b;
  --border-color:#1e293b;
  --glass-bg:rgba(15,23,42,0.7);--glass-border:rgba(148,163,184,0.1);
  --nav-bg:rgba(15,23,42,0.85);--hero-bg:linear-gradient(135deg,#0a0e1a 0%,#0f172a 50%,#1e1b4b 100%);
  --shadow-sm:0 4px 20px rgba(0,0,0,0.3);--shadow-md:0 8px 30px rgba(0,0,0,0.4);--shadow-lg:0 20px 60px rgba(0,0,0,0.5);
}
.dark-theme .animated-gradient{background:linear-gradient(-45deg,#0a0e1a,#0f172a,#1e1b4b,#0c4a6e,#0a0e1a);background-size:400% 400%;animation:gradientFlow 15s ease infinite}
.dark-theme .hero-badge{color:var(--primary-light)}
.dark-theme .company-tag{color:var(--primary-light)}
.dark-theme .badge-success{color:var(--primary-light)}
.dark-theme body{background:#070b14}
.dark-mode-toggle{
  width:40px;height:40px;border-radius:var(--r-md);
  background:var(--bg-tertiary);border:1px solid var(--border-color);
  color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;transition:all .25s var(--transition);font-family:inherit;
}
.dark-mode-toggle:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-2px)}
.dark-mode-toggle .sun-icon{display:none}
.dark-mode-toggle .moon-icon{display:block}
.dark-theme .dark-mode-toggle .sun-icon{display:block}
.dark-theme .dark-mode-toggle .moon-icon{display:none}
/* ====== Python Lab ====== */
.python-lab-layout{display:grid;grid-template-columns:280px 1fr;gap:24px;min-height:600px}
.python-lessons-sidebar{background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:18px;padding:16px;height:fit-content;position:sticky;top:88px;max-height:calc(100vh - 120px);overflow-y:auto}
.python-editor-container{display:flex;flex-direction:column;gap:16px}
.python-editor-wrapper{background:#0d1117;border-radius:12px;overflow:hidden;border:1px solid #1f2937}
.python-editor-header{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:#161b22;border-bottom:1px solid #1f2937;flex-wrap:wrap;gap:8px}
.python-editor-actions{display:flex;gap:8px;flex-wrap:wrap}
.python-output-console{background:#0d1117;border:1px solid #1f2937;border-radius:12px;overflow:hidden}
.python-output-header{padding:8px 16px;background:#161b22;border-bottom:1px solid #1f2937;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.python-output-content{padding:16px;font-family:var(--font-mono);font-size:.875rem;color:#e6edf3;min-height:120px;max-height:320px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.lesson-item-python{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;cursor:pointer;margin-bottom:4px;border:1px solid transparent;transition:all .2s}
.lesson-item-python:hover{background:var(--bg-tertiary)}
.lesson-item-python.active{background:rgba(16,185,129,0.1);border-color:var(--primary)}
.lesson-item-python.completed::before{content:'✓';color:var(--primary);font-weight:700}
.lesson-number-circle{width:28px;height:28px;border-radius:50%;background:var(--bg-tertiary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;color:var(--text-muted);flex-shrink:0}
.lesson-item-python.active .lesson-number-circle{background:var(--primary);color:white}
.lesson-item-python.completed .lesson-number-circle{background:var(--primary);color:white}
@media (max-width:1024px){.python-lab-layout{grid-template-columns:1fr;gap:16px;min-height:auto}.python-lessons-sidebar{position:relative;top:0;max-height:none;order:2}.python-editor-container{order:1}}
@media (max-width:768px){.CodeMirror{height:240px!important;font-size:13px!important}.python-editor-header{padding:6px 8px}.python-editor-actions{width:100%;justify-content:flex-end}.python-editor-actions .btn{padding:6px 10px;font-size:.8rem}.python-output-content{font-size:.8rem;padding:12px;min-height:100px;max-height:240px}.lesson-item-python{padding:10px 12px}.lesson-number-circle{width:32px;height:32px;font-size:.85rem}}
@media (max-width:480px){.CodeMirror{height:200px!important;font-size:12px!important}.python-editor-actions .btn{flex:1;justify-content:center;padding:8px 6px;font-size:.75rem}.python-output-content{padding:10px;font-size:.75rem}}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font-en);background:var(--bg-primary);color:var(--text-primary);line-height:1.6;transition:background .4s var(--transition),color .4s var(--transition);overflow-x:hidden;min-height:100vh;font-size:calc(1rem * var(--font-scale))}
html[lang="fa"] body{font-family:var(--font-fa)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-tertiary)}
::-webkit-scrollbar-thumb{background:var(--grad-1);border-radius:5px}
::-webkit-scrollbar-thumb:hover{filter:brightness(1.1)}
::selection{background:var(--primary);color:white}
#particle-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:0.5;transition:opacity .4s}
#particle-canvas.disabled{opacity:0}
.container{width:100%;max-width:1280px;margin:0 auto;padding:0 var(--s-lg)}
.app-wrapper{min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1}
main{flex:1;width:100%;animation:pageEnter .5s var(--transition)}
.section{padding:var(--s-3xl) 0}
.section-tight{padding:var(--s-xl) 0}
@keyframes pageEnter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.navbar{position:sticky;top:0;z-index:100;background:var(--nav-bg);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--border-color);transition:all .3s var(--transition)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:72px;gap:var(--s-lg)}
.nav-logo{display:flex;align-items:center;gap:var(--s-sm);cursor:pointer;font-weight:800;font-size:1.3rem;color:var(--text-primary);text-decoration:none;font-family:var(--font-display)}
.nav-logo-icon{width:44px;height:44px;border-radius:var(--r-md);background:var(--grad-1);display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:white;box-shadow:0 4px 14px rgba(var(--particle-color),0.4),inset 0 1px 0 rgba(255,255,255,0.3);position:relative;overflow:hidden;transition:transform .3s var(--transition)}
.nav-logo:hover .nav-logo-icon{transform:scale(1.08) rotate(-5deg)}
.nav-logo-icon::before{content:'';position:absolute;inset:-2px;background:linear-gradient(45deg,transparent,rgba(255,255,255,0.4),transparent);animation:shimmer 3s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.nav-links{display:flex;align-items:center;gap:2px;list-style:none}
.nav-link{padding:var(--s-sm) var(--s-md);border-radius:var(--r-md);color:var(--text-secondary);text-decoration:none;font-weight:500;font-size:.9rem;cursor:pointer;transition:all .25s var(--transition);background:none;border:none;font-family:inherit;position:relative;display:inline-flex;align-items:center;gap:var(--s-xs)}
.nav-link:hover{color:var(--primary);background:rgba(var(--particle-color),0.08)}
.nav-link.active{color:var(--primary);background:rgba(var(--particle-color),0.12);font-weight:600}
.nav-link.active::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:24px;height:3px;background:var(--grad-1);border-radius:2px;box-shadow:0 2px 8px rgba(var(--particle-color),0.5)}
.nav-actions{display:flex;align-items:center;gap:var(--s-sm)}
.icon-btn{width:40px;height:40px;border-radius:var(--r-md);background:var(--bg-tertiary);border:1px solid var(--border-color);color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;transition:all .25s var(--transition);font-family:inherit}
.icon-btn:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.lang-toggle{background:var(--bg-tertiary);border:1px solid var(--border-color);color:var(--text-primary);padding:var(--s-xs) var(--s-md);border-radius:var(--r-full);cursor:pointer;font-weight:700;font-size:.8rem;font-family:var(--font-display);transition:all .25s var(--transition);letter-spacing:.5px;height:40px;display:inline-flex;align-items:center}
.lang-toggle:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-2px)}
.hamburger{display:none;width:44px;height:44px;border-radius:var(--r-md);background:var(--bg-tertiary);border:1px solid var(--border-color);cursor:pointer;position:relative;padding:0}
.hamburger span{display:block;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:22px;height:2px;background:var(--text-primary);border-radius:2px;transition:all .3s var(--transition)}
.hamburger span:nth-child(1){transform:translate(-50%,-8px)}
.hamburger span:nth-child(3){transform:translate(-50%,8px)}
.hamburger.open span:nth-child(1){transform:translate(-50%,0) rotate(45deg)}
.hamburger.open span:nth-child(2){opacity:0;transform:translate(-50%,0) scale(0)}
.hamburger.open span:nth-child(3){transform:translate(-50%,0) rotate(-45deg)}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(8px);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s ease}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.mobile-drawer{position:fixed;top:0;bottom:0;width:300px;background:var(--bg-secondary);z-index:201;transition:transform .4s var(--transition);padding:var(--s-xl);overflow-y:auto;box-shadow:0 0 40px rgba(0,0,0,0.2)}
html[dir="rtl"] .mobile-drawer{right:-300px}
html[dir="ltr"] .mobile-drawer{left:-300px}
html[dir="rtl"] .mobile-drawer.open{right:0}
html[dir="ltr"] .mobile-drawer.open{left:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-xs);padding:var(--s-sm) var(--s-lg);border-radius:var(--r-md);font-weight:600;font-size:.9rem;cursor:pointer;transition:all .25s var(--transition);border:none;font-family:inherit;text-decoration:none;white-space:nowrap;position:relative;overflow:hidden;min-height:44px}
.btn-primary{background:var(--grad-1);color:white;box-shadow:0 4px 14px rgba(var(--particle-color),0.3),inset 0 1px 0 rgba(255,255,255,0.2)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(var(--particle-color),0.45),inset 0 1px 0 rgba(255,255,255,0.2)}
.btn-primary::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);transition:left .5s ease}
.btn-primary:hover::before{left:100%}
.btn-secondary{background:var(--bg-tertiary);color:var(--text-primary);border:1px solid var(--border-color)}
.btn-secondary:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-1px)}
.btn-outline{background:transparent;color:var(--primary);border:2px solid var(--primary)}
.btn-outline:hover{background:var(--primary);color:white;transform:translateY(-1px)}
.btn-danger{background:#ef4444;color:white}
.btn-danger:hover{background:#dc2626;transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--text-secondary);border:none}
.btn-ghost:hover{color:var(--primary);background:rgba(var(--particle-color),0.08)}
.btn-sm{padding:var(--s-xs) var(--s-md);font-size:.85rem;min-height:36px}
.btn-lg{padding:var(--s-md) var(--s-xl);font-size:1rem}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.hero{position:relative;padding:var(--s-3xl) 0 var(--s-2xl);background:var(--hero-bg);overflow:hidden;min-height:90vh;display:flex;align-items:center}
.animated-gradient{background-size:400% 400%;animation:gradientFlow 15s ease infinite}
@keyframes gradientFlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.hero-content{position:relative;z-index:2;max-width:780px}
.hero-badge{display:inline-flex;align-items:center;gap:var(--s-xs);padding:var(--s-xs) var(--s-md);background:rgba(var(--particle-color),0.1);color:var(--primary-dark);border:1px solid rgba(var(--particle-color),0.2);border-radius:var(--r-full);font-size:.85rem;font-weight:600;margin-bottom:var(--s-lg);backdrop-filter:blur(10px);animation:badgePulse 3s ease infinite}
.dark-theme .hero-badge{color:var(--primary-light)}
@keyframes badgePulse{0%,100%{box-shadow:0 0 0 0 rgba(var(--particle-color),0.4)}50%{box-shadow:0 0 0 12px rgba(var(--particle-color),0)}}
.hero-title{font-size:clamp(3rem,7vw,5.5rem);font-weight:900;line-height:1.05;background:var(--grad-1);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:var(--s-md);letter-spacing:-.03em;font-family:var(--font-display);filter:drop-shadow(0 4px 20px rgba(var(--particle-color),0.3))}
.hero-subtitle{font-size:1.4rem;color:var(--text-secondary);margin-bottom:var(--s-md);font-weight:500;line-height:1.4}
.hero-tagline{font-size:1rem;color:var(--text-muted);margin-bottom:var(--s-xl);max-width:620px;line-height:1.7}
.hero-cta{display:flex;flex-wrap:wrap;gap:var(--s-md);margin-bottom:var(--s-2xl)}

  .hero-stat:not(:last-child)::after{display:none}
  .container{padding:0 var(--s-md)}
  .hero-cta{flex-direction:column}
  .hero-cta .btn{width:100%}
  .path-question-text{font-size:1.25rem}
  .branch-header{flex-direction:column;text-align:center}
  .settings-fab{bottom:var(--s-md);right:var(--s-md)}
  html[dir="rtl"] .settings-fab{right:auto;left:var(--s-md)}
  .toast-container{top:80px;right:var(--s-md);left:var(--s-md)}
  .toast{min-width:auto;max-width:none;width:100%}
  .theme-grid{grid-template-columns:repeat(5,1fr)}
  .nav-actions .lang-toggle{display:none}
}
@media (max-width:480px){
  .hero-stats{grid-template-columns:1fr}
  .card-grid,.card-grid-3{grid-template-columns:1fr}
}
.text-center{text-align:center}.text-left{text-align:left}.text-right{text-align:right}
.flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}
.justify-center{justify-content:center}.justify-between{justify-content:space-between}
.gap-sm{gap:var(--s-sm)}.gap-md{gap:var(--s-md)}.gap-lg{gap:var(--s-lg)}
.mt-sm{margin-top:var(--s-sm)}.mt-md{margin-top:var(--s-md)}.mt-lg{margin-top:var(--s-lg)}.mt-xl{margin-top:var(--s-xl)}
.mb-sm{margin-bottom:var(--s-sm)}.mb-md{margin-bottom:var(--s-md)}.mb-lg{margin-bottom:var(--s-lg)}.mb-xl{margin-bottom:var(--s-xl)}
.hidden{display:none}.w-full{width:100%}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-lg)}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-lg)}
@media (max-width:768px){.grid-2,.grid-3{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ============================================================
   ADMIN PANEL PROFESSIONAL STYLES
   ============================================================ */
body.admin-active{background:#0a0e1a}
body.admin-active.admin-light{background:#f8fafc}

/* Admin Theme Variables - DARK (default) */
body.admin-active{
  --adm-bg:#0a0e1a;--adm-surface:#0f172a;--adm-surface-2:#1e293b;--adm-surface-3:#334155;
  --adm-text:#f9fafb;--adm-text-2:#cbd5e1;--adm-text-muted:#64748b;
  --adm-border:#1e293b;--adm-border-2:#334155;
  --adm-primary:#10b981;--adm-primary-light:#34d399;--adm-primary-dark:#059669;
  --adm-accent:#06b6d4;--adm-purple:#8b5cf6;--adm-amber:#f59e0b;--adm-red:#ef4444;
  --adm-grad:linear-gradient(135deg,#10b981 0%,#06b6d4 100%);
  --adm-shadow-sm:0 1px 3px rgba(0,0,0,0.3);
  --adm-shadow:0 8px 30px rgba(0,0,0,0.4);
  --adm-shadow-lg:0 20px 60px rgba(0,0,0,0.5);
}
/* Admin Theme Variables - LIGHT */
body.admin-active.admin-light{
  --adm-bg:#f8fafc;--adm-surface:#ffffff;--adm-surface-2:#f1f5f9;--adm-surface-3:#e2e8f0;
  --adm-text:#0f172a;--adm-text-2:#334155;--adm-text-muted:#64748b;
  --adm-border:#e2e8f0;--adm-border-2:#cbd5e1;
  --adm-primary:#059669;--adm-primary-light:#10b981;--adm-primary-dark:#047857;
  --adm-accent:#0891b2;--adm-purple:#7c3aed;--adm-amber:#d97706;--adm-red:#dc2626;
  --adm-grad:linear-gradient(135deg,#059669 0%,#0891b2 100%);
  --adm-shadow-sm:0 1px 3px rgba(15,23,42,0.04),0 4px 20px rgba(15,23,42,0.06);
  --adm-shadow:0 8px 30px rgba(15,23,42,0.1);
  --adm-shadow-lg:0 20px 60px rgba(15,23,42,0.15);
}

/* Admin Layout */
.admin-layout{display:flex;min-height:100vh;background:var(--adm-bg);color:var(--adm-text);font-family:var(--font-en);direction:ltr}
.admin-layout.rtl{direction:rtl;font-family:var(--font-fa)}
.admin-sidebar{
  width:260px;background:var(--adm-surface);border-right:1px solid var(--adm-border);
  position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:50;
  transition:transform .3s var(--transition);
}
.admin-layout.rtl .admin-sidebar{left:auto;right:0;border-right:none;border-left:1px solid var(--adm-border)}
.admin-sidebar-header{
  display:flex;align-items:center;gap:10px;padding:20px 24px;
  border-bottom:1px solid var(--adm-border);
}
.admin-sidebar-logo{
  width:40px;height:40px;border-radius:10px;background:var(--adm-grad);
  display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:white;
  box-shadow:0 4px 14px rgba(16,185,129,0.4);
}
.admin-sidebar-brand{font-weight:800;font-size:1.1rem;color:var(--adm-text);font-family:var(--font-display);letter-spacing:-.02em}
.admin-sidebar-brand small{display:block;font-size:.7rem;color:var(--adm-text-muted);font-weight:400;letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.admin-nav{padding:16px 12px}
.admin-nav-section{margin-bottom:24px}
.admin-nav-section-title{font-size:.7rem;font-weight:700;color:var(--adm-text-muted);text-transform:uppercase;letter-spacing:1.5px;padding:0 12px;margin-bottom:8px}
.admin-nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;
  color:var(--adm-text-2);cursor:pointer;font-weight:500;font-size:.9rem;border:none;
  background:none;width:100%;text-align:left;font-family:inherit;transition:all .2s;
  border-left:3px solid transparent;margin-bottom:2px;
}
.admin-layout.rtl .admin-nav-item{text-align:right;border-left:none;border-right:3px solid transparent}
.admin-nav-item:hover{background:var(--adm-surface-2);color:var(--adm-text)}
.admin-nav-item.active{
  background:linear-gradient(135deg,rgba(16,185,129,0.18),rgba(6,182,212,0.1));
  color:var(--adm-primary-light);border-left-color:var(--adm-primary);
}
.admin-layout.rtl .admin-nav-item.active{border-left:none;border-right-color:var(--adm-primary)}
.admin-nav-item.active svg{color:var(--adm-primary)}
.admin-nav-icon{width:20px;height:20px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.admin-nav-badge{margin-left:auto;background:var(--adm-surface-3);color:var(--adm-text-2);padding:2px 8px;border-radius:9999px;font-size:.7rem;font-weight:700}
.admin-layout.rtl .admin-nav-badge{margin-left:0;margin-right:auto}
.admin-nav-badge.alert{background:rgba(239,68,68,0.2);color:#f87171}
.admin-sidebar-footer{padding:16px 12px;border-top:1px solid var(--adm-border);position:absolute;bottom:0;left:0;right:0;background:var(--adm-surface)}
.admin-theme-toggle{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:10px;background:var(--adm-surface-2);margin-bottom:8px}

/* Admin Main */
.admin-main{flex:1;margin-left:260px;padding:32px;min-height:100vh}
.admin-layout.rtl .admin-main{margin-left:0;margin-right:260px}
.admin-topbar{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;
  padding-bottom:24px;border-bottom:1px solid var(--adm-border);flex-wrap:wrap;gap:16px;
}
.admin-page-title{font-size:1.75rem;font-weight:700;color:var(--adm-text);font-family:var(--font-display);letter-spacing:-.02em}
.admin-page-subtitle{font-size:.85rem;color:var(--adm-text-muted);margin-top:4px}
.admin-topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.admin-status-pill{padding:4px 12px;background:rgba(16,185,129,0.15);color:var(--adm-primary-light);border-radius:9999px;font-size:.8rem;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.admin-status-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--adm-primary);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Admin Buttons */
.adm-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 16px;border-radius:8px;font-weight:600;font-size:.875rem;
  cursor:pointer;transition:all .2s;border:none;font-family:inherit;white-space:nowrap;
  background:var(--adm-surface-2);color:var(--adm-text);border:1px solid var(--adm-border);
}
.adm-btn:hover{background:var(--adm-surface-3);transform:translateY(-1px)}
.adm-btn-primary{background:var(--adm-grad);color:white;border:none}
.adm-btn-primary:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 6px 20px rgba(16,185,129,0.35)}
.adm-btn-danger{background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.3)}
.adm-btn-danger:hover{background:rgba(239,68,68,0.25)}
.adm-btn-warning{background:rgba(245,158,11,0.15);color:#fbbf24;border:1px solid rgba(245,158,11,0.3)}
.adm-btn-warning:hover{background:rgba(245,158,11,0.25)}
.adm-btn-success{background:rgba(16,185,129,0.15);color:var(--adm-primary-light);border:1px solid rgba(16,185,129,0.3)}
.adm-btn-success:hover{background:rgba(16,185,129,0.25)}
.adm-btn-sm{padding:5px 10px;font-size:.8rem}
.adm-btn-icon{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.adm-btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

/* Admin Cards */
.adm-card{background:var(--adm-surface);border:1px solid var(--adm-border);border-radius:16px;padding:24px;transition:all .3s var(--transition)}
.adm-card-hover:hover{transform:translateY(-2px);box-shadow:var(--adm-shadow);border-color:var(--adm-border-2)}
.adm-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--adm-border);flex-wrap:wrap;gap:12px}
.adm-card-title{font-size:1.1rem;font-weight:600;color:var(--adm-text);font-family:var(--font-display)}
.adm-card-subtitle{font-size:.8rem;color:var(--adm-text-muted);margin-top:2px}

/* Admin Stat Cards */
.adm-stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:28px}
.adm-stat-card{
  background:var(--adm-surface);border:1px solid var(--adm-border);border-radius:16px;
  padding:24px;position:relative;overflow:hidden;transition:all .3s var(--transition);
}
.adm-stat-card:hover{transform:translateY(-3px);box-shadow:var(--adm-shadow);border-color:var(--adm-border-2)}
.adm-stat-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--adm-grad)}
.adm-stat-card.accent-purple::before{background:linear-gradient(180deg,#8b5cf6,#ec4899)}
.adm-stat-card.accent-amber::before{background:linear-gradient(180deg,#f59e0b,#ef4444)}
.adm-stat-card.accent-cyan::before{background:linear-gradient(180deg,#06b6d4,#3b82f6)}
.adm-stat-icon{font-size:1.8rem;margin-bottom:8px;display:inline-block}
.adm-stat-value{font-size:2.25rem;font-weight:800;color:var(--adm-text);line-height:1;font-family:var(--font-display);letter-spacing:-.02em}
.adm-stat-label{color:var(--adm-text-muted);font-size:.85rem;margin-top:6px}
.adm-stat-trend{font-size:.75rem;margin-top:8px;display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px}
.adm-stat-trend.up{background:rgba(16,185,129,0.15);color:var(--adm-primary-light)}
.adm-stat-trend.down{background:rgba(239,68,68,0.15);color:#f87171}
.adm-stat-trend.neutral{background:var(--adm-surface-2);color:var(--adm-text-muted)}

/* Admin Charts */
.adm-chart-container{position:relative;height:200px;padding:16px 0}
.adm-bar-chart{display:flex;align-items:flex-end;gap:3px;height:100%;padding-bottom:24px}
.adm-bar-chart-bar{flex:1;background:var(--adm-grad);border-radius:4px 4px 0 0;min-height:2px;position:relative;transition:all .4s var(--transition);cursor:pointer}
.adm-bar-chart-bar:hover{filter:brightness(1.2);transform:scaleY(1.05)}
.adm-bar-chart-bar::after{content:attr(data-value);position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:.7rem;color:var(--adm-primary-light);font-weight:600;opacity:0;transition:opacity .2s;white-space:nowrap}
.adm-bar-chart-bar:hover::after{opacity:1}
.adm-bar-chart-label{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:.65rem;color:var(--adm-text-muted);white-space:nowrap}

/* Admin Heatmap */
.adm-heatmap{display:grid;grid-template-columns:auto repeat(24,1fr);gap:2px;font-size:.7rem}
.adm-heatmap-label{color:var(--adm-text-muted);padding:4px 8px;display:flex;align-items:center}
.adm-heatmap-cell{aspect-ratio:1;border-radius:3px;min-height:18px;transition:all .2s;cursor:pointer;position:relative}
.adm-heatmap-cell:hover{transform:scale(1.4);z-index:2;outline:1px solid var(--adm-primary)}
.adm-heatmap-cell[data-level="0"]{background:var(--adm-surface-2)}
.adm-heatmap-cell[data-level="1"]{background:rgba(16,185,129,0.25)}
.adm-heatmap-cell[data-level="2"]{background:rgba(16,185,129,0.45)}
.adm-heatmap-cell[data-level="3"]{background:rgba(16,185,129,0.65)}
.adm-heatmap-cell[data-level="4"]{background:rgba(16,185,129,0.85)}
.adm-heatmap-cell[data-level="5"]{background:var(--adm-primary)}
.adm-heatmap-cell::after{content:attr(data-tip);position:absolute;bottom:130%;left:50%;transform:translateX(-50%);background:#000;color:white;padding:4px 8px;border-radius:4px;font-size:.7rem;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.adm-heatmap-cell:hover::after{opacity:1}
.adm-heatmap-legend{display:flex;align-items:center;gap:4px;margin-top:12px;font-size:.75rem;color:var(--adm-text-muted);justify-content:flex-end}
.adm-heatmap-legend-cells{display:flex;gap:2px}
.adm-heatmap-legend-cells .adm-heatmap-cell{width:14px;height:14px;min-height:14px;cursor:default}

/* Admin Tables */
.adm-table-wrap{background:var(--adm-surface);border:1px solid var(--adm-border);border-radius:16px;overflow:hidden}
.adm-table{width:100%;border-collapse:collapse;font-size:.875rem}
.adm-table thead{background:var(--adm-surface-2)}
.adm-table th{padding:12px 16px;text-align:left;font-weight:600;color:var(--adm-text-muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--adm-border);white-space:nowrap}
.adm-layout.rtl .adm-table th,.admin-layout.rtl .adm-table th{text-align:right}
.adm-table td{padding:12px 16px;border-bottom:1px solid var(--adm-border);color:var(--adm-text-2);vertical-align:middle}
.adm-table tbody tr{transition:background .2s}
.adm-table tbody tr:hover{background:var(--adm-surface-2)}
.adm-table tbody tr:last-child td{border-bottom:none}
.adm-table-actions{display:flex;gap:4px;flex-wrap:wrap}
.adm-user-avatar{width:32px;height:32px;border-radius:50%;background:var(--adm-grad);color:white;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;flex-shrink:0}
.adm-user-cell{display:flex;align-items:center;gap:10px}
.adm-user-cell-info{display:flex;flex-direction:column}
.adm-user-cell-info strong{color:var(--adm-text);font-weight:600;font-size:.875rem}
.adm-user-cell-info small{color:var(--adm-text-muted);font-size:.75rem}

/* Admin Forms */
.adm-form-group{margin-bottom:16px}
.adm-form-label{display:block;margin-bottom:6px;font-weight:600;color:var(--adm-text);font-size:.85rem}
.adm-form-input,.adm-form-textarea,.adm-form-select{
  width:100%;padding:10px 14px;background:var(--adm-surface-2);
  border:1px solid var(--adm-border);border-radius:8px;color:var(--adm-text);
  font-size:.9rem;font-family:inherit;transition:all .2s;
}
.adm-form-input:focus,.adm-form-textarea:focus,.adm-form-select:focus{
  outline:none;border-color:var(--adm-primary);box-shadow:0 0 0 3px rgba(16,185,129,0.15);
}
.adm-form-textarea{min-height:100px;resize:vertical;font-family:var(--font-mono);font-size:.8rem}
.adm-form-hint{font-size:.75rem;color:var(--adm-text-muted);margin-top:4px}
.adm-form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.adm-form-row{grid-template-columns:1fr}}
.adm-input-group{display:flex;gap:8px;align-items:center}
.adm-input-group .adm-form-input{flex:1}

/* Admin Search */
.adm-search-bar{
  display:flex;align-items:center;gap:8px;padding:8px 14px;
  background:var(--adm-surface-2);border:1px solid var(--adm-border);
  border-radius:9999px;margin-bottom:16px;
}
.adm-search-bar input{flex:1;background:none;border:none;color:var(--adm-text);font-size:.875rem;outline:none;font-family:inherit}
.adm-search-bar input::placeholder{color:var(--adm-text-muted)}

/* Admin Filters */
.adm-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.adm-filter-chip{padding:6px 12px;background:var(--adm-surface-2);border:1px solid var(--adm-border);border-radius:9999px;color:var(--adm-text-2);font-size:.8rem;font-weight:500;cursor:pointer;transition:all .2s;font-family:inherit}
.adm-filter-chip:hover{border-color:var(--adm-primary);color:var(--adm-primary-light)}
.adm-filter-chip.active{background:var(--adm-grad);color:white;border-color:transparent}

/* Admin Badges */
.adm-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:9999px;font-size:.72rem;font-weight:600}
.adm-badge-success{background:rgba(16,185,129,0.15);color:var(--adm-primary-light)}
.adm-badge-warning{background:rgba(245,158,11,0.15);color:#fbbf24}
.adm-badge-danger{background:rgba(239,68,68,0.15);color:#f87171}
.adm-badge-info{background:rgba(6,182,212,0.15);color:#22d3ee}
.adm-badge-purple{background:rgba(139,92,246,0.15);color:#a78bfa}
.adm-badge-neutral{background:var(--adm-surface-3);color:var(--adm-text-2)}

/* Admin Progress */
.adm-progress{height:6px;background:var(--adm-surface-2);border-radius:9999px;overflow:hidden}
.adm-progress-bar{height:100%;background:var(--adm-grad);border-radius:9999px;transition:width .5s var(--transition)}

/* Admin Empty State */
.adm-empty{text-align:center;padding:48px 24px;color:var(--adm-text-muted)}
.adm-empty-icon{font-size:3rem;margin-bottom:12px;opacity:.5}

/* Admin Login Page */
.admin-login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a0e1a 0%,#0f172a 50%,#1e1b4b 100%);padding:24px;position:relative;overflow:hidden}
.admin-login-page::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(16,185,129,0.15),transparent 50%),radial-gradient(circle at 70% 80%,rgba(139,92,246,0.15),transparent 50%);pointer-events:none}
.admin-login-card{background:rgba(15,23,42,0.85);backdrop-filter:blur(24px);border:1px solid rgba(55,65,81,0.5);border-radius:24px;padding:48px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.5);position:relative;z-index:1}
.admin-login-logo{width:72px;height:72px;margin:0 auto 16px;border-radius:18px;background:linear-gradient(135deg,#10b981,#06b6d4);display:flex;align-items:center;justify-content:center;font-size:2rem;color:white;box-shadow:0 8px 24px rgba(16,185,129,0.4)}
.admin-login-title{font-size:1.5rem;font-weight:700;color:#f9fafb;margin-bottom:4px;text-align:center}
.admin-login-subtitle{color:#9ca3af;font-size:.9rem;text-align:center;margin-bottom:32px}
.admin-login-input{width:100%;padding:12px 16px;background:rgba(31,41,55,0.6);border:1px solid rgba(75,85,99,0.5);border-radius:12px;color:#f9fafb;font-size:.95rem;font-family:inherit;transition:all .2s}
.admin-login-input:focus{outline:none;border-color:#10b981;box-shadow:0 0 0 4px rgba(16,185,129,0.15);background:rgba(31,41,55,0.9)}
.admin-login-input.error{border-color:#ef4444;animation:shake .4s}
.admin-login-error{color:#f87171;font-size:.85rem;margin-top:8px;display:flex;align-items:center;gap:6px;min-height:20px}
.admin-login-attempts{display:flex;gap:4px;margin-top:8px}
.admin-login-attempt-dot{width:8px;height:8px;border-radius:50%;background:rgba(75,85,99,0.5)}
.admin-login-attempt-dot.used{background:#ef4444}
.admin-login-info{margin-top:24px;padding:12px;background:rgba(15,23,42,0.5);border:1px solid rgba(55,65,81,0.3);border-radius:10px;font-size:.78rem;color:#9ca3af;text-align:center}
.admin-login-info code{color:#34d399;font-family:var(--font-mono);font-size:.78rem;background:rgba(16,185,129,0.1);padding:1px 6px;border-radius:4px}
.admin-login-lock{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.4);border-radius:12px;padding:16px;text-align:center;color:#f87171;margin-bottom:16px}
.admin-login-lock-icon{font-size:2rem;margin-bottom:8px}
.admin-welcome-banner{background:linear-gradient(135deg,rgba(16,185,129,0.15),rgba(6,182,212,0.1));border:1px solid rgba(16,185,129,0.3);border-radius:16px;padding:20px;margin-bottom:24px;display:flex;align-items:center;gap:16px}
.admin-welcome-banner-icon{font-size:2.5rem}

const BioHubGames={
  t(k){return window.BioHubI18n.t(k);},f(o,n){return window.BioHubI18n.field(o,n);},
  renderGame(s){

  header(title,score,level,time){

  },
  quizState:{q:0,score:0,answered:false},
  renderQuiz(){
    const qs=window.BioHubData.knowledgeQuiz;
    if(this.quizState.q>=qs.length){
      const total=qs.length*10,pct=Math.round(this.quizState.score/total*100);
      let m='',e='';
      if(pct>=80){m='عالی! / Excellent!';e='🏆';}else if(pct>=60){m='خوب! / Good!';e='🌟';}else if(pct>=40){m='بد نبود / Not bad';e='📚';}else{m='ادامه بده / Keep trying';e='💪';}

    }

  ansQuiz(k){
    if(this.quizState.answered)return;
    const q=window.BioHubData.knowledgeQuiz[this.quizState.q];this.quizState.answered=true;

  dnaState:{score:0,level:1,codon:null,matched:0,time:60,timer:null,table:{'ATG':'M (Met)','TTT':'F (Phe)','GCT':'A (Ala)','TAA':'* (Stop)','GGT':'G (Gly)','TGT':'C (Cys)','AAA':'K (Lys)','CAA':'Q (Gln)','TGG':'W (Trp)','CCT':'P (Pro)','ACT':'T (Thr)'}},
  renderDna(){
    if(this.dnaState.codon===null)this.dnaNext();
    const correct=this.dnaState.table[this.dnaState.codon];

  t(k){const l=window.BioHubAuth.adminLang||'fa';return(this.i18n[l]&&this.i18n[l][k])||k;},
  setLang(l){window.BioHubAuth.adminLang=l;localStorage.setItem('biohub_admin_lang',l);window.BioHubApp.render();},

  setTheme(t){window.BioHubAuth.adminTheme=t;localStorage.setItem('biohub_admin_theme',t);document.body.classList.toggle('admin-light',t==='light');},
  toggleTheme(){this.setTheme(window.BioHubAuth.adminTheme==='dark'?'light':'dark');},
  showToast(msg,type='info'){
    const c=document.getElementById('admin-toast-container');if(!c)return;
    const el=document.createElement('div');el.className='adm-toast '+type;
    const icons={success:'✓',error:'✗',warning:'⚠',info:'ℹ'};
    el.innerHTML=`<span class="adm-toast-icon">${icons[type]||''}</span><span class="adm-toast-msg">${msg}</span>`;
    c.appendChild(el);
    setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(40px)';if(document.documentElement.dir==='rtl')el.style.transform='translateX(-40px)';setTimeout(()=>el.remove(),300);},3000);
  },

  /* ============================================================
     LOGIN PAGE
     ============================================================ */
  renderLogin(){
    const lockout=window.BioHubAuth.getLockoutInfo();
    const attemptsLeft=window.BioHubAuth.getAttemptsLeft();
    const isLocked=lockout&&Date.now()<lockout.until;
    const minsLeft=isLocked?Math.ceil((lockout.until-Date.now())/60000):0;
    /* Render attempt dots */
    const max=window.BioHubData.admin.maxLoginAttempts;
    const used=max-attemptsLeft;
    const dots=Array.from({length:max},(_,i)=>`<div class="admin-login-attempt-dot ${i<used?'used':''}"></div>`).join('');
    return `<div class="admin-login-page">
      <div class="admin-login-card">
        <div style="text-align:center;margin-bottom:32px">
          <div class="admin-login-logo">🧬</div>
          <h1 class="admin-login-title">${this.t('login_title')}</h1>
          <p class="admin-login-subtitle">${this.t('login_subtitle')}</p>
        </div>
        ${isLocked?`<div class="admin-login-lock">
          <div class="admin-login-lock-icon">🔒</div>
          <strong>${this.t('locked_out')}</strong>
          <p style="margin-top:8px;font-size:.85rem">${this.t('locked_until')}: ${minsLeft} ${this.t('minutes')}</p>
        </div>`:`<form onsubmit="return false">
          <div class="form-group" style="margin-bottom:16px">
            <label style="color:#e2e8f0;font-weight:500;display:block;margin-bottom:8px;font-size:.9rem">${this.t('password')}</label>
            <div style="position:relative">
              <input type="password" id="admin-password" autofocus class="admin-login-input" placeholder="${this.t('enter_password')}" autocomplete="current-password" style="width:100%;padding:12px 48px 12px 16px">
              <button type="button" onclick="BioHubAdmin.togglePasswordVisibility()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#9ca3af;cursor:pointer;font-size:1.2rem" title="${this.t('show_password')}">👁</button>
            </div>
            <div class="admin-login-error" id="login-error"></div>
            <div class="admin-login-attempts" title="${this.t('attempts_dots')}">${dots}</div>
          </div>
          <button class="btn btn-primary btn-block" style="margin-top:8px" onclick="BioHubAdmin.handleLogin()">${this.t('login_btn')}</button>
        </form>`}
        <div class="admin-login-info">
          <div style="margin-bottom:8px"><strong>${this.t('hint_title')}</strong></div>
          <div style="margin-bottom:4px">${this.t('hint_url')}: <code>#${window.BioHubData.admin.secretUrlHash}</code></div>
          <div style="margin-bottom:8px">${this.t('hint_password')}: <code>${window.BioHubData.admin.passwordPlainDefault}</code></div>
          <div style="color:#6b7280;font-size:.72rem">⚠ ${this.t('hint_change')}</div>
        </div>
        <a style="display:block;text-align:center;margin-top:24px;color:#6b7280;font-size:.85rem;cursor:pointer" onclick="BioHubApp.navigate('home')">← ${this.t('back_to_site')}</a>
      </div>
    </div>`;
  },
  togglePasswordVisibility(){
    const i=document.getElementById('admin-password');if(!i)return;
    i.type=i.type==='password'?'text':'password';
  },
  initLogin(){
    const i=document.getElementById('admin-password');
    if(i)i.addEventListener('keypress',e=>{if(e.key==='Enter')this.handleLogin();});
  },
  handleLogin(){
    const i=document.getElementById('admin-password');const err=document.getElementById('login-error');
    if(!i)return;
    const password=i.value;
    if(!password){if(err)err.textContent=this.t('enter_password');return;}
    const r=window.BioHubAuth.adminLogin(password);
    if(r.success){
      this.showWelcomeBanner=r.lastLogin;
      window.BioHubAuth.showToast(this.t('welcome_back'),'success',2000);
      window.location.hash='admin-panel';
    }else{
      if(err){
        if(r.error==='wrong_password'){
          err.textContent=`${this.t('wrong_password')} · ${r.attemptsLeft} ${this.t('attempts_left')}`;
        }else if(r.error==='locked_out'){
          err.textContent=`${this.t('locked_out')} · ${r.minutesLeft} ${this.t('minutes')}`;
        }else{
          err.textContent=this.t('wrong_password');
        }
      }
      i.classList.add('error');
      i.value='';
      setTimeout(()=>i.classList.remove('error'),500);
      window.BioHubApp.render();
    }
  },

  /* ============================================================
     ADMIN PANEL LAYOUT
     ============================================================ */
  renderPanel(){
    const s=(window.BioHubApp.currentParams&&window.BioHubApp.currentParams.section)||'dashboard';
    let c='';
    if(s==='dashboard')c=this.renderDashboard();
    else if(s==='branches')c=this.renderBranches();
    else if(s==='lessons')c=this.renderLessons();
    else if(s==='careers')c=this.renderCareers();
    else if(s==='quiz')c=this.renderQuiz();
    else if(s==='users')c=this.renderUsers();
    else if(s==='analytics')c=this.renderAnalytics();
    else if(s==='logs')c=this.renderLogs();
    else if(s==='login-logs')c=this.renderLoginLogs();
    else if(s==='messages')c=this.renderMessages();
    else if(s==='settings')c=this.renderSettings();
    else if(s==='backup')c=this.renderBackup();
    else c=this.renderDashboard();
    const isRtl=window.BioHubAuth.adminLang==='fa';
    return `<div class="admin-layout ${isRtl?'rtl':''}" id="admin-layout">
      ${this.renderSidebar(s)}
      <div class="admin-main">
        <button class="admin-mobile-toggle" onclick="document.getElementById('admin-sidebar').classList.toggle('open')">☰</button>
        <div class="admin-topbar">
          <div>
            <h1 class="admin-page-title">${this.secTitle(s)}</h1>
            <p class="admin-page-subtitle">${this.secSubtitle(s)}</p>
          </div>
          <div class="admin-topbar-actions">
            <span class="admin-status-pill"><span class="dot"></span>${this.t('admin_badge')}</span>
            <button class="adm-btn adm-btn-sm" onclick="BioHubAdmin.toggleLang()" title="Language">${window.BioHubAuth.adminLang==='fa'?'EN':'فا'}</button>
            <button class="adm-btn adm-btn-sm" onclick="BioHubAdmin.toggleTheme()" title="Theme">${window.BioHubAuth.adminTheme==='dark'?'☀️':'🌙'}</button>
            <button class="adm-btn adm-btn-sm" onclick="BioHubApp.navigate('home')">${this.t('back_to_site_btn')}</button>
            <button class="adm-btn adm-btn-danger adm-btn-sm" onclick="BioHubAdmin.logout()">${this.t('logout')}</button>
          </div>
        </div>
        ${this.showWelcomeBanner?this.renderWelcomeBanner(this.showWelcomeBanner):''}
        <div id="admin-content">${c}</div>
      </div>
    </div>`;
  },
  renderWelcomeBanner(lastLoginTs){
    this.showWelcomeBanner=null;
    let lastLoginText='';
    if(lastLoginTs){
      const d=new Date(lastLoginTs);
      lastLoginText=this.t('last_login')+': '+d.toLocaleString(window.BioHubAuth.adminLang==='fa'?'fa-IR':'en-US');
    }else{
      lastLoginText=this.t('welcome_first');
    }
    return `<div class="admin-welcome-banner">
      <div class="admin-welcome-banner-icon">👋</div>
      <div class="admin-welcome-banner-text">
        <strong>${this.t('welcome_back')}!</strong>
        <small>${lastLoginText}</small>
      </div>
    </div>`;
  },

    const m={dashboard:this.t('dash_title'),branches:this.t('branches_title'),lessons:this.t('lessons_title'),careers:this.t('careers_title'),quiz:this.t('nav_quiz'),users:this.t('users_title'),analytics:this.t('analytics_title'),logs:this.t('logs_title'),'login-logs':this.t('login_logs_title'),messages:this.t('messages_title'),settings:this.t('settings_title'),backup:this.t('backup_title')};

    return m[s]||'';

  /* ============================================================
     DASHBOARD
     ============================================================ */
  renderDashboard(){
    const a=window.BioHubAuth.getAnalytics();
    const stats=[
      {i:'👥',v:a.totalUsers,l:this.t('stat_users'),accent:''},
      {i:'🟢',v:a.activeUsers,l:this.t('stat_active'),accent:'accent-cyan'},
      {i:'🚫',v:a.blockedUsers,l:this.t('stat_blocked'),accent:'accent-amber'},
      {i:'👁️',v:a.totalVisits,l:this.t('stat_visits'),accent:''},
      {i:'🎓',v:a.lessonsCompleted,l:this.t('stat_lessons_done'),accent:'accent-purple'},
      {i:'🎮',v:a.gamesPlayed,l:this.t('stat_games'),accent:'accent-purple'}
    ];
    const sh=stats.map(s=>`<div class="adm-stat-card ${s.accent}">
      <div class="adm-stat-icon">${s.i}</div>
      <div class="adm-stat-value">${s.v}</div>
      <div class="adm-stat-label">${s.l}</div>
    </div>`).join('');
    /* 24h activity bar chart */
    const ev=window.BioHubAuth.getEvents();const now=Date.now();
    const hours=[];
    for(let i=23;i>=0;i--){const start=now-i*3600000,end=now-(i-1)*3600000;hours.push(ev.filter(e=>{const t=new Date(e.timestamp).getTime();return t>=start&&t<end;}).length);}
    const max=Math.max(...hours,1);
    const bars=hours.map((c,i)=>`<div class="adm-bar-chart-bar" style="height:${(c/max)*100}%" data-value="${c}"><span class="adm-bar-chart-label">${i===23?'now':(23-i)+'h'}</span></div>`).join('');
    /* Language distribution donut */
    const langCount={fa:0,en:0};
    ev.forEach(e=>{if(e.lang)langCount[e.lang]=(langCount[e.lang]||0)+1;});
    const totalLang=langCount.fa+langCount.en||1;
    const faPct=Math.round(langCount.fa/totalLang*100);
    const enPct=100-faPct;
    const faDeg=Math.round(faPct*3.6);
    const donutStyle=`background:conic-gradient(#10b981 0deg ${faDeg}deg,#06b6d4 ${faDeg}deg 360deg)`;
    /* Top branches */
    const branchViews={};
    ev.filter(e=>e.type==='branch_view').forEach(e=>{const s=e.data?.slug;if(s)branchViews[s]=(branchViews[s]||0)+1;});
    const topBranches=Object.entries(branchViews).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const topBranchesHtml=topBranches.length?topBranches.map(([slug,count])=>{
      const b=window.BioHubData.branches.find(x=>x.slug===slug);if(!b)return '';
      const maxV=topBranches[0][1];
      return `<div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:.85rem">
          <span>${b.icon} ${window.BioHubAuth.adminLang==='fa'?b.nameFa:b.nameEn}</span>
          <strong style="color:var(--adm-primary-light)">${count}</strong>
        </div>
        <div class="adm-progress"><div class="adm-progress-bar" style="width:${(count/maxV)*100}%"></div></div>
      </div>`;
    }).join(''):`<div class="adm-empty"><div class="adm-empty-icon">📊</div><p>${this.t('no_activity')}</p></div>`;
    /* Page views distribution */
    const pageViews={};
    ev.filter(e=>e.type==='page_view').forEach(e=>{const v=e.data?.view||'home';pageViews[v]=(pageViews[v]||0)+1;});
    const pageViewsList=Object.entries(pageViews).sort((a,b)=>b[1]-a[1]).slice(0,6);
    const pageViewsHtml=pageViewsList.length?pageViewsList.map(([view,count])=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--adm-border);font-size:.85rem"><span style="color:var(--adm-text-2)">/${view}</span><strong>${count}</strong></div>`).join(''):`<div class="adm-empty"><p>${this.t('no_activity')}</p></div>`;
    /* Recent activity table */
    const events=a.recentEvents.slice(0,8).map(e=>`<tr>
      <td style="padding:10px 16px;border-bottom:1px solid var(--adm-border);font-family:var(--font-mono);font-size:.75rem;color:var(--adm-text-2)">${new Date(e.timestamp).toLocaleString(window.BioHubAuth.adminLang==='fa'?'fa-IR':'en-US')}</td>
      <td style="padding:10px 16px;border-bottom:1px solid var(--adm-border)"><span class="adm-badge ${this.eventBadgeClass(e.type)}">${this.eventLabel(e.type)}</span></td>
      <td style="padding:10px 16px;border-bottom:1px solid var(--adm-border);color:var(--adm-text-muted);font-size:.8rem">${e.lang||'-'}</td>
    </tr>`).join('');
    /* Quick actions */
    const quickActions=`<div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="adm-btn adm-btn-primary" onclick="BioHubAdmin.nav('branches')">➕ ${this.t('add_branch')}</button>
      <button class="adm-btn" onclick="BioHubAdmin.nav('lessons')">📚 ${this.t('add_lesson')}</button>
      <button class="adm-btn" onclick="BioHubAdmin.nav('users')">👥 ${this.t('add_user')}</button>
      <button class="adm-btn" onclick="BioHubAdmin.nav('backup')">💾 ${this.t('export_data')}</button>
    </div>`;
    return `<div class="adm-stat-grid">${sh}</div>
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:24px;margin-bottom:24px" class="admin-responsive-grid">
      <div class="adm-card">
        <div class="adm-card-header"><div><div class="adm-card-title">📊 ${this.t('chart_activity_24h')}</div><div class="adm-card-subtitle">${this.t('recent_activity')}</div></div></div>
        <div class="adm-chart-container"><div class="adm-bar-chart">${bars}</div></div>
      </div>
      <div class="adm-card">
        <div class="adm-card-header"><div class="adm-card-title">🌐 ${this.t('chart_lang_dist')}</div></div>
        <div class="adm-donut" style="${donutStyle}">
          <div class="adm-donut-text">
            <div class="adm-donut-value">${faPct}%</div>
            <div class="adm-donut-label">FA</div>
          </div>
        </div>
        <div class="adm-legend">
          <div class="adm-legend-item"><span class="adm-legend-dot" style="background:#10b981"></span>فارسی (FA): ${langCount.fa}</div>
          <div class="adm-legend-item"><span class="adm-legend-dot" style="background:#06b6d4"></span>English (EN): ${langCount.en}</div>
        </div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px" class="admin-responsive-grid">
      <div class="adm-card">
        <div class="adm-card-header"><div class="adm-card-title">🧬 ${this.t('chart_top_branches')}</div></div>
        ${topBranchesHtml}
      </div>
      <div class="adm-card">
        <div class="adm-card-header"><div class="adm-card-title">📄 ${this.t('chart_page_views')}</div></div>
        ${pageViewsHtml}
      </div>
    </div>
    <div class="adm-card" style="margin-bottom:24px">
      <div class="adm-card-header"><div class="adm-card-title">⚡ ${this.t('quick_actions')}</div></div>
      ${quickActions}
    </div>
    <div class="adm-table-wrap">
      <div style="padding:20px 24px;border-bottom:1px solid var(--adm-border);display:flex;justify-content:space-between;align-items:center">
        <h3 style="font-size:1.05rem;font-weight:600;color:var(--adm-text)">🕒 ${this.t('recent_activity')}</h3>
        <button class="adm-btn adm-btn-sm" onclick="BioHubAdmin.nav('logs')">${this.t('view_all_logs')} →</button>
      </div>
      <table class="adm-table">
        <thead><tr>
          <th>${this.t('col_time')}</th><th>${this.t('col_type')}</th><th>${this.t('col_lang')}</th>
        </tr></thead>
        <tbody>${events||`<tr><td colspan="3" style="text-align:center;padding:32px;color:var(--adm-text-muted)">${this.t('no_activity')}</td></tr>`}</tbody>
      </table>
    </div>`;
  },
  eventBadgeClass(type){
    const m={visit:'adm-badge-info',page_view:'adm-badge-purple',branch_view:'adm-badge-success',lesson_complete:'adm-badge-success',game_play:'adm-badge-warning'};
    return m[type]||'adm-badge-neutral';
  },
  eventLabel(type){
    const m={visit:this.t('event_visit'),page_view:this.t('event_page_view'),branch_view:this.t('event_branch_view'),lesson_complete:this.t('event_lesson_complete'),game_play:this.t('event_game_play')};

  /* ============================================================
     BRANCHES CRUD
     ============================================================ */
  renderBranches(){
    const bs=window.BioHubData.branches;
    const rows=bs.map(b=>`<tr>
      <td style="padding:12px 16px;border-bottom:1px solid var(--adm-border);font-size:1.5rem">${b.icon}</td>
      <td style="padding:12px 16px;border-bottom:1px solid var(--adm-border)"><strong style="color:var(--adm-text)">${window.BioHubAuth.adminLang==='fa'?b.nameFa:b.nameEn}</strong><br><small style="color:var(--adm-text-muted);font-family:var(--font-mono)">${b.slug}</small></td>
      <td style="padding:12px 16px;border-bottom:1px solid var(--adm-border)"><span class="adm-badge" style="background:${b.color}20;color:${b.color}">${window.BioHubAuth.adminLang==='fa'?b.categoryFa:b.categoryEn}</span></td>
      <td style="padding:12px 16px;border-bottom:1px solid var(--adm-border);color:var(--adm-text-2)">${b.skills.length}</td>
      <td style="padding:12px 16px;border-bottom:1px solid var(--adm-border)">
        <div class="adm-table-actions">
          <button class="adm-btn adm-btn-sm adm-btn-success" onclick="BioHubAdmin.editBranch('${b.slug}')">✎ ${this.t('edit')}</button>
          <button class="adm-btn adm-btn-sm adm-btn-danger" onclick="BioHubAdmin.deleteBranch('${b.slug}')">🗑 ${this.t('delete')}</button>
        </div>
      </td>
    </tr>`).join('');
    return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px">
      <div class="adm-search-bar" style="flex:1;min-width:200px;margin:0">
        <span>🔍</span>
        <input type="text" id="branch-search" placeholder="${this.t('search')}" oninput="BioHubAdmin.filterBranches(this.value)">
      </div>
      <button class="adm-btn adm-btn-primary" onclick="BioHubAdmin.editBranch(null)">➕ ${this.t('add_new')}</button>
    </div>
    <div class="adm-table-wrap">
      <table class="adm-table">
        <thead><tr>
          <th>${this.t('col_icon')}</th><th>${this.t('col_name')}</th>
          <th>${this.t('col_category')}</th><th>${this.t('col_skills_count')}</th>
          <th>${this.t('col_actions')}</th>
        </tr></thead>
        <tbody id="branches-tbody">${rows}</tbody>
      </table>
    </div>`;
  },
  filterBranches(q){
    q=(q||'').toLowerCase();
    const bs=window.BioHubData.branches.filter(b=>{
      const name=window.BioHubAuth.adminLang==='fa'?b.nameFa:b.nameEn;
      return name.toLowerCase().includes(q)||b.slug.toLowerCase().includes(q);
    });
    const tbody=document.getElementById('branches-tbody');if(!tbody)return;
    if(!bs.length){tbody.innerHTML=`<tr><td colspan="5" class="adm-empty"><div class="adm-empty-icon">🔍</div><p>${this.t('no_data')}</p></td></tr>`;return;}
    tbody.innerHTML=bs.map(b=>`<tr>
      <td style="padding:12px 16px;border-bottom:1px solid var(--adm-border);font-size:1.5rem">${b.icon}</td>
      <td style="padding:12px 16px;border-bottom:1px solid var(--adm-border)"><strong style="color:var(--adm-text)">${window.BioHubAuth.adminLang==='fa'?b.nameFa:b.nameEn}</strong><br><small style="color:var(--adm-text-muted);font-family:var(--font-mono)">${b.slug}</small></td>
      <td style="padding:12px 16px;border-bottom:1px solid var(--adm-border)"><span class="adm-badge" style="background:${b.color}20;color:${b.color}">${window.BioHubAuth.adminLang==='fa'?b.categoryFa:b.categoryEn}</span></td>
      <td style="padding:12px 16px;border-bottom:1px solid var(--adm-border);color:var(--adm-text-2)">${b.skills.length}</td>
      <td style="padding:12px 16px;border-bottom:1px solid var(--adm-border)">
        <div class="adm-table-actions">
          <button class="adm-btn adm-btn-sm adm-btn-success" onclick="BioHubAdmin.editBranch('${b.slug}')">✎ ${this.t('edit')}</button>
          <button class="adm-btn adm-btn-sm adm-btn-danger" onclick="BioHubAdmin.deleteBranch('${b.slug}')">🗑 ${this.t('delete')}</button>
        </div>
      </td>
    </tr>`).join('');
  },
  editBranch(slug){
    const b=slug?window.BioHubData.branches.find(x=>x.slug===slug):null;
    const skillsText=b?b.skills.map(s=>`${window.BioHubAuth.adminLang==='fa'?s.name:s.nameEn}|${s.level}`).join('\n'):'';
    const careersText=b?(b.careers||[]).join(', '):'';
    this.openModal({
      title:slug?`${this.t('edit')}: ${b.slug}`:this.t('add_new'),
      size:'lg',
      body:`<div class="adm-form-row">
        <div class="adm-form-group"><label class="adm-form-label">${this.t('branch_name_fa')}</label><input type="text" class="adm-form-input" id="bf-nameFa" value="${b?b.nameFa:''}"></div>
        <div class="adm-form-group"><label class="adm-form-label">${this.t('branch_name_en')}</label><input type="text" class="adm-form-input" id="bf-nameEn" value="${b?b.nameEn:''}"></div>
      </div>
      <div class="adm-form-row">
        <div class="adm-form-group"><label class="adm-form-label">${this.t('branch_summary_fa')}</label><input type="text" class="adm-form-input" id="bf-summaryFa" value="${b?b.summaryFa:''}"></div>
        <div class="adm-form-group"><label class="adm-form-label">${this.t('branch_summary_en')}</label><input type="text" class="adm-form-input" id="bf-summaryEn" value="${b?b.summaryEn:''}"></div>
      </div>
      <div class="adm-form-row">
        <div class="adm-form-group"><label class="adm-form-label">${this.t('branch_icon')}</label><input type="text" class="adm-form-input" id="bf-icon" value="${b?b.icon:'🧬'}" maxlength="4"></div>
        <div class="adm-form-group"><label class="adm-form-label">${this.t('branch_color')}</label><input type="color" class="adm-form-input" id="bf-color" value="${b?b.color:'#10b981'}" style="height:42px"></div>
      </div>
      <div class="adm-form-row">
        <div class="adm-form-group"><label class="adm-form-label">${this.t('branch_slug')}</label><input type="text" class="adm-form-input" id="bf-slug" value="${b?b.slug:''}" placeholder="e.g. my-branch" ${slug?'readonly':''}></div>
        <div class="adm-form-group"><label class="adm-form-label">${this.t('branch_category')}</label>
          <select class="adm-form-select" id="bf-category">
            ${['main','molecular','applied','theoretical'].map(c=>`<option value="${c}" ${b&&b.category===c?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="adm-form-group"><label class="adm-form-label">${this.t('branch_desc_fa')}</label><textarea class="adm-form-textarea" id="bf-descFa" rows="3">${b?b.descriptionFa:''}</textarea></div>
      <div class="adm-form-group"><label class="adm-form-label">${this.t('branch_desc_en')}</label><textarea class="adm-form-textarea" id="bf-descEn" rows="3">${b?b.descriptionEn:''}</textarea></div>
      <div class="adm-form-group"><label class="adm-form-label">${this.t('branch_skills')}</label><textarea class="adm-form-textarea" id="bf-skills" rows="4" placeholder="PCR techniques|intermediate&#10;CRISPR|advanced">${skillsText}</textarea>
        <div class="adm-form-hint">Format: name|level (level: basic/intermediate/advanced)</div>
      </div>
      <div class="adm-form-group"><label class="adm-form-label">${this.t('branch_careers')}</label><input type="text" class="adm-form-input" id="bf-careers" value="${careersText}" placeholder="genetic-counselor, genomic-researcher"></div>`,
      onSave:()=>{
        const data={
          slug:document.getElementById('bf-slug').value.trim(),
          nameFa:document.getElementById('bf-nameFa').value,
          nameEn:document.getElementById('bf-nameEn').value,
          summaryFa:document.getElementById('bf-summaryFa').value,
          summaryEn:document.getElementById('bf-summaryEn').value,
          descriptionFa:document.getElementById('bf-descFa').value,
          descriptionEn:document.getElementById('bf-descEn').value,
          icon:document.getElementById('bf-icon').value||'🧬',
          color:document.getElementById('bf-color').value,
          category:document.getElementById('bf-category').value,
          categoryFa:{main:'اصلی',molecular:'مولکولی',applied:'کاربردی',theoretical:'نظری'}[document.getElementById('bf-category').value],
          categoryEn:{main:'Main',molecular:'Molecular',applied:'Applied',theoretical:'Theoretical'}[document.getElementById('bf-category').value],
          skills:document.getElementById('bf-skills').value.split('\n').filter(l=>l.trim()).map(l=>{const [name,level]=l.split('|');return{name:name.trim(),nameEn:name.trim(),level:(level||'basic').trim()};}),
          careers:document.getElementById('bf-careers').value.split(',').map(s=>s.trim()).filter(Boolean)
        };
        if(!data.slug||!data.nameFa){this.showToast(this.t('error'),'error');return false;}
        if(slug){
          const i=window.BioHubData.branches.findIndex(x=>x.slug===slug);
          if(i>=0)window.BioHubData.branches[i]={...window.BioHubData.branches[i],...data};
          this.showToast(this.t('updated_success'),'success');
        }else{
          if(window.BioHubData.branches.find(x=>x.slug===data.slug)){this.showToast('Slug already exists','error');return false;}
          window.BioHubData.branches.push(data);
          this.showToast(this.t('added_success'),'success');
        }
        this.saveContent();
        window.BioHubApp.render();
        return true;
      }
    });
  },
  deleteBranch(slug){
    if(!confirm(this.t('confirm_delete')+' (slug: '+slug+')'))return;
    const i=window.BioHubData.branches.findIndex(x=>x.slug===slug);
    if(i>=0){window.BioHubData.branches.splice(i,1);this.saveContent();this.showToast(this.t('deleted_success'),'success');window.BioHubApp.render();}
  },
  saveContent(){localStorage.setItem('biohub_content',JSON.stringify({branches:window.BioHubData.branches,lessons:window.BioHubData.pythonLessons,careers:window.BioHubData.careers,knowledgeQuiz:window.BioHubData.knowledgeQuiz,branchQuiz:window.BioHubData.branchQuiz}));},

  renderQuiz(){
    const qs=window.BioHubData.knowledgeQuiz;
    const rows=qs.map((q,i)=>`<tr>
      <td style="padding:12px 16px;border-bottom:1px solid var(--adm-border)"><strong>#${i+1}</strong></td>
      <td style="padding:12px 16px;border-bottom:1px solid var(--adm-border);max-width:400px"><span style="color:var(--adm-text)">${window.BioHubAuth.adminLang==='fa'?q.questionFa:q.questionEn}</span></td>

      <td style="padding:12px 16px;border-bottom:1px solid var(--adm-border)">
        <div class="adm-table-actions">
          <button class="adm-btn adm-btn-sm adm-btn-success" onclick="BioHubAdmin.editQuiz(${i})">✎</button>
          <button class="adm-btn adm-btn-sm adm-btn-danger" onclick="BioHubAdmin.deleteQuiz(${i})">🗑</button>

    return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px">
      <h3 style="color:var(--adm-text);font-size:1.1rem">${this.t('nav_quiz')} (${qs.length})</h3>
      <button class="adm-btn adm-btn-primary" onclick="BioHubAdmin.editQuiz(null)">➕ ${this.t('add_new')}</button>
    </div>
    <div class="adm-table-wrap">
      <table class="adm-table">
        <thead><tr><th>#</th><th>${this.t('col_name')}</th><th>Options</th><th>Answer</th><th>${this.t('col_actions')}</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  },
  editQuiz(index){
    const q=(index!==null&&index>=0)?window.BioHubData.knowledgeQuiz[index]:null;
    const optsHtml=(q?q.options:[]).map((o,i)=>`<div style="display:flex;gap:8px;margin-bottom:8px;align-items:center">
      <input type="radio" name="correct-opt" value="${o.key}" ${q&&q.correct===o.key?'checked':''} style="accent-color:var(--adm-primary)">
      <input type="text" class="adm-form-input" data-opt-key="${o.key}" data-opt-idx="${i}" placeholder="key (a/b/c/d)" value="${o.key}" style="max-width:60px">
      <input type="text" class="adm-form-input" data-opt-text-fa="${o.key}" placeholder="متن فارسی" value="${o.textFa}">
      <input type="text" class="adm-form-input" data-opt-text-en="${o.key}" placeholder="English text" value="${o.textEn}">
    </div>`).join('');
    this.openModal({
      title:index!==null?`${this.t('edit')} #${index+1}`:this.t('add_new'),
      size:'lg',
      body:`<div class="adm-form-group"><label class="adm-form-label">${this.t('lesson_title_fa')}</label><textarea class="adm-form-textarea" id="qf-questionFa" rows="2">${q?q.questionFa:''}</textarea></div>
      <div class="adm-form-group"><label class="adm-form-label">${this.t('lesson_title_en')}</label><textarea class="adm-form-textarea" id="qf-questionEn" rows="2">${q?q.questionEn:''}</textarea></div>
      <div class="adm-form-group"><label class="adm-form-label">Options (select correct answer)</label>
        <div id="opts-container">${optsHtml||'<p style="color:var(--adm-text-muted);font-size:.85rem">No options yet</p>'}</div>
        <button class="adm-btn adm-btn-sm" style="margin-top:8px" onclick="BioHubAdmin.addQuizOption()">➕ Add option</button>
      </div>
      <div class="adm-form-row">
        <div class="adm-form-group"><label class="adm-form-label">Explanation (FA)</label><textarea class="adm-form-textarea" id="qf-explFa" rows="2">${q?q.explanationFa:''}</textarea></div>
        <div class="adm-form-group"><label class="adm-form-label">Explanation (EN)</label><textarea class="adm-form-textarea" id="qf-explEn" rows="2">${q?q.explanationEn:''}</textarea></div>
      </div>`,
      onSave:()=>{
        const questionFa=document.getElementById('qf-questionFa').value;
        const questionEn=document.getElementById('qf-questionEn').value;
        const explanationFa=document.getElementById('qf-explFa').value;
        const explanationEn=document.getElementById('qf-explEn').value;
        if(!questionFa){this.showToast(this.t('error'),'error');return false;}
        /* Collect options */
        const options=[];
        const optRows=document.querySelectorAll('#opts-container > div');
        optRows.forEach(row=>{
          const inputs=row.querySelectorAll('input');
          const radio=row.querySelector('input[type="radio"]');
          const keyInput=inputs[1];const textFaInput=inputs[2];const textEnInput=inputs[3];
          if(keyInput&&textFaInput&&textEnInput){
            const key=keyInput.value.trim();const textFa=textFaInput.value;const textEn=textEnInput.value;
            if(key)options.push({key,textFa,textEn});
          }
        });
        const correctRadio=document.querySelector('input[name="correct-opt"]:checked');
        if(!correctRadio||!options.length){this.showToast('Need at least one option with correct answer','error');return false;}
        const data={questionFa,questionEn,options,correct:correctRadio.value,explanationFa,explanationEn};
        if(index!==null&&index>=0){
          window.BioHubData.knowledgeQuiz[index]=data;
          this.showToast(this.t('updated_success'),'success');
        }else{
          window.BioHubData.knowledgeQuiz.push(data);
          this.showToast(this.t('added_success'),'success');
        }
        this.saveContent();window.BioHubApp.render();return true;
      }
    });
  },
  addQuizOption(){
    const c=document.getElementById('opts-container');if(!c)return;
    const idx=c.children.length;
    const key=String.fromCharCode(97+idx);
    const div=document.createElement('div');
    div.style.cssText='display:flex;gap:8px;margin-bottom:8px;align-items:center';
    div.innerHTML=`<input type="radio" name="correct-opt" value="${key}" style="accent-color:var(--adm-primary)">
      <input type="text" class="adm-form-input" data-opt-key="${key}" data-opt-idx="${idx}" placeholder="key" value="${key}" style="max-width:60px">
      <input type="text" class="adm-form-input" data-opt-text-fa="${key}" placeholder="متن فارسی">
      <input type="text" class="adm-form-input" data-opt-text-en="${key}" placeholder="English text">
      <button class="adm-btn adm-btn-sm adm-btn-danger" onclick="this.parentElement.remove()">✕</button>`;
    c.appendChild(div);
  },
  deleteQuiz(index){
    if(!confirm(this.t('confirm_delete')))return;
    window.BioHubData.knowledgeQuiz.splice(index,1);
    this.saveContent();this.showToast(this.t('deleted_success'),'success');window.BioHubApp.render();
  },

  viewUser(id){

    this.openModal({

  editUser(id){

    this.openModal({
      title:`${this.t('edit_user')}: ${u.username}`,
      body:`<div class="adm-form-group"><label class="adm-form-label">${this.t('col_username')}</label><input type="text" class="adm-form-input" id="uf-username" value="${u.username}"></div>
      <div class="adm-form-group"><label class="adm-form-label">${this.t('col_email')}</label><input type="email" class="adm-form-input" id="uf-email" value="${u.email}"></div>

  toggleBlockUser(id,blocked){

  deleteUser(id){
    if(!confirm(this.t('confirm_delete_user')))return;
    const users=window.BioHubAuth.getUsers().filter(x=>x.id!==id);

    this.showToast(this.t('deleted_success'),'success');
    window.BioHubApp.render();
